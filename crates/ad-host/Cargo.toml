[package]
name = "ad-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "After Dark for Linux: control panel, idle daemon, and fullscreen multi-monitor saver runtime"

[[bin]]
name = "after-dark"
path = "src/main.rs"

[dependencies]
ad-sdk = { path = "../ad-sdk" }
ad-modules = { path = "../ad-modules" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
libc = "0.2"
softbuffer = "0.4"
winit = "0.30"
x11rb = { version = "0.13", features = ["randr", "screensaver", "xkb"] }
